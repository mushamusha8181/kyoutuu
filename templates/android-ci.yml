name: Android CI

# 無料枠保護: 通常の push / pull_request では自動実行しない。
# 検査・リリース前確認など、必要なときだけ明示的に手動実行する。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Assemble debug
        run: ./gradlew assembleDebug

      - name: Lint
        if: ${{ always() }}
        run: ./gradlew lintDebug

      - name: Unit tests
        if: ${{ always() }}
        run: ./gradlew testDebugUnitTest

      - name: regressionCheck when available
        if: ${{ always() }}
        shell: bash
        run: |
          if ./gradlew tasks --all --console=plain | grep -Eq '(^|[[:space:]])regressionCheck([[:space:]]|$)'; then
            ./gradlew regressionCheck
          else
            echo 'regressionCheck is not defined; skipping.'
          fi

      - name: Upload Lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          if-no-files-found: warn
          retention-days: 7
          path: |
            **/build/reports/lint-results-*.html
            **/build/reports/lint-results-*.xml
            **/build/reports/lint-results-*.txt
